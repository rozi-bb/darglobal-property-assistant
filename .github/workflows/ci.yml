# Lint + unit test on every push / PR. Unit tests use a fake LLM and no database,
# so no API key or secret is needed. Integration tests (real DeepSeek API) run locally:
# `uv run pytest -q -m integration`.
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen --all-extras --python 3.12
      - name: Lint (ruff)
        run: uv run --frozen ruff check src tests
      - name: Unit tests
        run: uv run --frozen pytest -q
