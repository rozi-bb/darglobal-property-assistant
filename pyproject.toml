[project]
name = "darglobal-chatbot"
version = "0.0.1"
description = "DarGlobal Property Assistant: chatbot LangGraph untuk data DarGlobal & Wasalt."
authors = [
    { name = "William Fu-Hinthorn", email = "13333726+hinthornw@users.noreply.github.com" },
]
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.14"
dependencies = [
    "chainlit>=2.12.0",
    "fastapi>=0.165.0",
    "fastembed>=0.9.1",
    "langchain>=1",
    "langchain-core>=1.8.4",
    "langchain-openai>=1.8.5",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-postgres>=3.2.1",
    "pgvector>=0.5.1",
    "psycopg[binary,pool]>=3.3.9",
    "python-dotenv>=1.0.1",
    "rank-bm25>=0.2.2",
    "typesafe-sdk>=0.7.5",
    "uvicorn[standard]>=0.41.0",
]


[project.optional-dependencies]
dev = ["mypy>=1.11.1", "ruff>=0.6.1"]

[build-system]
requires = ["setuptools>=84.1.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["langgraph.templates.agent", "agent", "server", "dataprep"]
[tool.setuptools.package-dir]
"langgraph.templates.agent" = "src/agent"
"agent" = "src/agent"
"server" = "src/server"
"dataprep" = "src/dataprep"


[tool.setuptools.package-data]
"*" = ["py.typed"]

[tool.ruff]
lint.select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle
    "D401", # First line should be in imperative mood
    "T201",
    "UP",
]
lint.ignore = [
    "UP006",
    "UP007",
    # We actually do want to import from typing_extensions
    "UP035",
    # Relax the convention by _not_ requiring documentation for every function parameter.
    "D417",
    "E501",
]
[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "UP"]
[tool.ruff.lint.pydocstyle]
convention = "google"

[dependency-groups]
dev = [
    "anyio>=4.14.2",
    "httpx>=0.28.1",
    "ipykernel>=7.4.0",
    "langgraph-cli[inmem]>=0.4.14",
    "markdownify>=1.2.4",
    "matplotlib>=3.11.2",
    "mypy>=1.13.0",
    "pandas>=3.1.1",
    "pytest>=9.0.3",
    "ruff>=0.8.2",
]

[tool.pytest.ini_options]
addopts = "-m 'not integration'"
markers = [
    "integration: memanggil API LLM asli (DeepSeek); jalankan dengan -m integration",
    "langsmith: test yang dilacak LangSmith",
]
